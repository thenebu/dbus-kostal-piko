[DEFAULT]
; Logging: DEBUG, INFO, WARNING, ERROR
logging = WARNING

; Device name shown in VRM/GX
device_name = Kostal Piko 17

; VRM device instance (must be unique per device)
device_instance = 52

; Poll interval in milliseconds
poll_interval = 1000

; Resilience: how many consecutive read errors before forcing a Modbus reconnect.
; With poll_interval=1000ms, 15 means ~15s of failures are tolerated before reconnect.
reconnect_after_errors = 15

; Resilience: how long (seconds) to keep the last-known values on D-Bus while reads
; are failing. Below this threshold the GUI keeps showing the previous reading and
; status, so brief RS485 hiccups are invisible. Above this threshold values are
; cleared and StatusCode is set to 10 (Error).
stale_threshold = 60

[MODBUS]
; Serial port of the USB-RS485 adapter
; Find yours with: dmesg | grep ttyUSB
port = /dev/ttyUSB3

; Modbus slave address (as configured on the Piko inverter menu)
slave_address = 3

; Serial parameters (Piko 17 defaults: 19200 baud, 8E1)
baudrate = 19200
parity = E
stopbits = 1
timeout = 3

[PV]
; Max rated power in Watts (Piko 17 = 17000, Piko 15 = 15000, etc.)
max = 17000

; Position: 0=AC input 1, 1=AC output, 2=AC input 2
; Use 0 if you don't have a MultiPlus/Quattro
position = 1
